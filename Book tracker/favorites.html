<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorites | BookVerse</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow sticky-top">

            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">

                    <i class="bi bi-book-half"></i>
                    BookVerse

                </a>


                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                    <span class="navbar-toggler-icon"></span>

                </button>


                <div
                    class="collapse navbar-collapse"
                    id="navbarNav">

                    <ul class="navbar-nav ms-auto">


                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="index.html">

                                Home

                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link active"
                                href="favorites.html">

                                Favorites

                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="tracker.html">

                                Tracker

                            </a>

                        </li>


                        <li class="nav-item">

                            <a
                                class="nav-link"
                                href="about.html">

                                About

                            </a>

                        </li>


                    </ul>

                </div>

            </div>

        </nav>

    </header>


    <!-- ================= FAVORITES HERO ================= -->

    <section class="favorites-hero">

        <div class="container text-center">

            <span class="badge bg-primary px-3 py-2 mb-3">

                <i class="bi bi-heart-fill"></i>
                Your Personal Collection

            </span>


            <h1 class="fw-bold">

                My Favorite Books

            </h1>


            <p class="text-muted">

                Keep all the books you love in one place.

            </p>

        </div>

    </section>


    <!-- ================= FAVORITES CONTENT ================= -->

    <main class="container py-5">


        <!-- Section heading -->

        <div
            class="favorites-heading d-flex justify-content-between align-items-center mb-4">


            <div>

                <h2 class="fw-bold mb-1">

                    ❤️ Saved Books

                </h2>


                <p
                    id="favoriteCount"
                    class="text-muted mb-0">

                    Your favorite books

                </p>

            </div>


            <a
                href="index.html"
                class="btn btn-primary">

                <i class="bi bi-search me-1"></i>

                Discover More

            </a>

        </div>


        <!-- Favorite books -->

        <div
            id="favoritesContainer"
            class="row g-4">

        </div>


    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="text-center text-white py-4">

        <h4>

            📚 BookVerse

        </h4>


        <p>

            Discover, Read and Track Your Favorite Books.

        </p>


        <small>

            &copy; 2026 BookVerse. All Rights Reserved.

        </small>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Favorites JS -->

    <script src="js/favorites.js"></script>


</body>

</html>
